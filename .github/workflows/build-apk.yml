name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------
      # Python 3.11 برای Buildozer
      # ---------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------
      # Java 17
      # ---------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------
      # System dependencies
      # ---------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # ---------------------------------------
      # Python tools
      # ---------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            "Cython==0.29.36" \
            virtualenv

      # ---------------------------------------
      # Android SDK
      # ---------------------------------------
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"

          mv \
            "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
            "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------
      # Buildozer directories
      # ---------------------------------------
      - name: Prepare Buildozer
        run: |
          rm -rf .buildozer

          mkdir -p "$HOME/.buildozer/android/platform"

          # Buildozer sometimes expects the old sdkmanager path
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          # Make Buildozer use the GitHub Actions SDK
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          cp -R "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          ln -sf \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

      # ---------------------------------------
      # PATCH: prevent p4a pip corruption
      #
      # p4a creates:
      # python -m venv venv
      #
      # We change it to:
      # python -m venv --clear venv
      #
      # Also constrain pip < 26.
      # ---------------------------------------
      - name: Prepare p4a patch
        run: |
          cat > "$GITHUB_WORKSPACE/pip-constraints.txt" <<'EOF'
          pip<26
          EOF

          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/pip-constraints.txt" >> "$GITHUB_ENV"

          echo "PIP constraint:"
          cat "$GITHUB_WORKSPACE/pip-constraints.txt"

      # ---------------------------------------
      # Install / checkout p4a
      # ---------------------------------------
      - name: Prepare python-for-android
        run: |
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"

          rm -rf "$P4A_DIR"

          git clone \
            --depth 1 \
            --branch v2026.05.09 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          cd "$P4A_DIR"

          echo "p4a version:"
          git describe --tags --always || true

          echo "Applying venv --clear patch..."

          python - <<'PY'
          from pathlib import Path

          path = Path("pythonforandroid/build.py")

          text = path.read_text()

          old = "shprint(host_python, '-m', 'venv', 'venv')"
          new = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print("PATCH APPLIED")
          elif new in text:
              print("PATCH ALREADY PRESENT")
          else:
              raise SystemExit(
                  "ERROR: Could not find p4a venv line to patch."
              )
          PY

          echo "Checking patch:"
          grep -n "venv.*clear" pythonforandroid/build.py || true

      # ---------------------------------------
      # Build APK
      # ---------------------------------------
      - name: Build APK
        env:
          PIP_CONSTRAINT: ${{ env.PIP_CONSTRAINT }}
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "PIP_CONSTRAINT:"
          echo "$PIP_CONSTRAINT"

          echo "Buildozer:"
          buildozer --version

          echo "Starting APK build..."

          buildozer -v android debug

      # ---------------------------------------
      # Upload APK
      # ---------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-mobile-apk
          path: bin/*.apk
          if-no-files-found: error