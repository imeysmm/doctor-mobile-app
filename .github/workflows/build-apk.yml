name: Build Doctor Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk

      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "SDK Manager:"
          echo "$SDKMANAGER"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Installed SDK:"
          "$SDKMANAGER" --list_installed || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer
          pip install --upgrade cython

      - name: Prepare Buildozer SDK
        run: |
          echo "Preparing Buildozer Android SDK..."

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          cp -r "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Creating legacy sdkmanager path..."

          mkdir -p \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          ln -sf \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          echo "SDK manager paths:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/"

          echo "Modern SDK manager:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/"

          echo "Build tools:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/build-tools/"

      - name: Verify project
        run: |
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          pwd
          ls -la

          test -f main.py
          test -f buildozer.spec

          echo "main.py found"
          echo "buildozer.spec found"

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show build result
        if: always()
        run: |
          echo "======================================"
          echo "BUILD RESULT"
          echo "======================================"

          if [ -f build.log ]; then
            tail -n 200 build.log
          else
            echo "build.log was not created."
          fi

          echo "======================================"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Doctor-Mobile-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Doctor-Mobile-APK
          path: bin/*.apk
          if-no-files-found: error